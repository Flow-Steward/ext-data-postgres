$schema: https://json-schema.org/draft/2020-12/schema
title: PostgreSQL secrets
type: object
additionalProperties: false
properties:
  password:
    type: string
    title: Password
    minLength: 1
    description: Password is required for postgres. Supply password or the matching
      profile-specific secret env variable. Managed PostgreSQL/MySQL/AlloyDB IAM profiles
      keep password optional; public config env is not a credential source.
  env:
    type: object
    title: Profile-specific secret environment
    additionalProperties: false
    properties:
      ALLOYDB_OMNI_PASSWORD:
        type: string
        minLength: 1
      ALLOYDB_POSTGRES_PASSWORD:
        type: string
        minLength: 1
      CLOUD_SQL_POSTGRES_PASSWORD:
        type: string
        minLength: 1
      POSTGRES_PASSWORD:
        type: string
        minLength: 1
description: Password is required for postgres. Supply password or the matching profile-specific
  secret env variable. Managed PostgreSQL/MySQL/AlloyDB IAM profiles keep password
  optional; public config env is not a credential source.
