component_id: toolbox_dataset_connector_overview
type: markdown
title: PostgreSQL
body: PostgreSQL supports schema inspection, saved-query reads and parameterized workflow INSERT, UPDATE
  and DELETE. The same direct PostgreSQL project connection also supports pgvector collection lifecycle,
  document/chunk writes and similarity search. The server administrator must install vector in public.
  SQL writes and vector writes are suppressed in test mode. Vector actions use the connection user/password
  plus optional schema, verified TLS and timeout settings; no triggers are exposed.
