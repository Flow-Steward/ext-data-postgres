  parameters:
  - name: connection_ref
    type: connection_ref
    required: true
    description: Select an existing project connection. SQL writes require database write permission.
      Vector actions require the direct postgres profile, pgvector installed in public, and permission
      on the collection schema (fs_vectors by default). Keep credentials in the connection secrets.
  - name: collection
    type: string
    required: true
    description: Name of the collection table in the connection schema (fs_vectors by default). Use letters,
      digits and underscores; start with a letter or underscore; maximum 48 characters. Run Create or
      check a collection before saving or searching.
  result_fields:
  - result.records
  - result.count
  - result.applied
  error_codes:
  - invalid_payload
  - invalid_connection
  - effect_claim_required
  - test_mode_suppressed
  - provider_unavailable
  - native_unavailable
  - invalid_provider_response
  - response_too_large
  - network_blocked
  - timeout
  - authentication_failed
  - index_configuration_mismatch
  - invalid_vector
  mutates_platform: false
  command_type: invoke_extension_action
- action_id: drop_collection
  workflow_visible: true
  title: 'Vector: Delete a collection and all its text'
  description: 'Remove a vector collection table, its indexes and every stored fragment. Use this to retire
    a knowledge base you no longer need. Select a direct PostgreSQL project connection, enter the collection
    name, and explicitly enable Confirm deletion. Example: remove a temporary collection named import_trial.
    This deletes data; test mode suppresses the deletion.'
  required_scopes:
  - extension:invoke
  handler:
    mode: extension
  parameters:
  - name: connection_ref
    type: connection_ref
    required: true
    description: Select an existing project connection. SQL writes require database write permission.
      Vector actions require the direct postgres profile, pgvector installed in public, and permission
      on the collection schema (fs_vectors by default). Keep credentials in the connection secrets.
  - name: collection
    type: string
    required: true
    description: Name of the collection table in the connection schema (fs_vectors by default). Use letters,
      digits and underscores; start with a letter or underscore; maximum 48 characters. Run Create or
      check a collection before saving or searching.
  - name: confirm
    type: boolean
    required: true
    description: Enable explicitly to delete the collection table, its indexes and all stored text. Leave
      disabled unless you intend to remove the entire collection.
  result_fields:
  - result.records
  - result.count
  - result.applied
  error_codes:
  - invalid_payload
  - invalid_connection
