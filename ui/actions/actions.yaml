actions:
- action_id: execute_write
  title: Execute PostgreSQL write
  description: Run one parameterized INSERT, UPDATE or DELETE on the selected project connection.
  workflow_visible: true
  required_scopes:
  - extension:invoke
  handler:
    mode: extension
  command_type: invoke_extension_action
  mutates_platform: true
  test_mode_behavior: suppress
  parameters:
  - name: connection_ref
    type: connection_ref
    required: true
  - name: sql
    type: string
    required: true
  - name: params
    type: object
    required: false
  - name: param_schema
    type: object
    required: false
  result_fields:
  - result.status
  - result.rows
  - result.returned_row_count
  error_codes:
  - invalid_payload
  - write_outcome_unknown
- action_id: test_connection
  workflow_visible: false
  title: Test database connection
  description: Validate the configured PostgreSQL connection.
  required_scopes:
  - extension:invoke
  handler:
    mode: extension
  mutates_platform: false
  result_fields:
  - result.status
  - result.connector_id
  - result.metadata.toolbox_prebuilt
  error_codes:
  - invalid_config
  - not_found
  - permission_denied
  - connector_runtime_failed
  - unknown_action
- action_id: introspect_schema
  workflow_visible: false
  title: Introspect database schema
  description: Return a typed dataset_schema_snapshot.v1 resource list.
  required_scopes:
  - extension:invoke
  handler:
    mode: extension
  mutates_platform: false
  result_fields:
  - result.schema_snapshot.schema_version
  - result.schema_snapshot.resources[].resource_id
  - result.schema_snapshot.resources[].columns[].name
  - result.schema_snapshot.resources[].indexes[].columns[]
  - result.resource_count
  error_codes:
  - invalid_config
  - not_found
  - permission_denied
  - connector_runtime_failed
  - unknown_action
- action_id: validate_query
  workflow_visible: false
  title: Validate query template
  description: Validate read-only SQL and dataset resource scope.
  required_scopes:
  - extension:invoke
  handler:
    mode: extension
  mutates_platform: false
  result_fields:
  - result.valid
  - result.read_only
  - result.referenced_resources[]
  error_codes:
  - invalid_config
  - connector_runtime_failed
  - unknown_action
- action_id: preview_query
  workflow_visible: false
  title: Preview query template
  description: Execute a bounded read-only preview.
  required_scopes:
  - extension:invoke
  handler:
    mode: extension
  mutates_platform: false
  result_fields:
  - result.rows[]
  - result.row_count
  - result.output_schema
  error_codes:
  - invalid_config
  - connector_runtime_failed
  - unknown_action
- action_id: execute_template
  workflow_visible: false
  title: Execute query template
  description: Execute a saved read-only query template.
  required_scopes:
  - extension:invoke
  handler:
    mode: extension
  mutates_platform: false
  result_fields:
  - result.rows[]
  - result.row_count
  - result.output_schema
  - result.truncated
  error_codes:
  - invalid_config
  - connector_runtime_failed
  - unknown_action
- action_id: infer_output_schema
  workflow_visible: false
  title: Infer output schema
  description: Infer output schema from a bounded preview.
  required_scopes:
  - extension:invoke
  handler:
    mode: extension
  mutates_platform: false
  result_fields:
  - result.output_schema
  error_codes:
  - invalid_config
  - connector_runtime_failed
  - unknown_action
- action_id: ensure_collection
  workflow_visible: true
  title: 'Vector: Ensure Collection'
  description: 'On the selected PostgreSQL connection: Create schema, dimensioned chunk table and HNSW
    index; verify existing dimension and metric. pgvector must already be installed in public.'
  required_scopes:
  - extension:invoke
  handler:
    mode: extension
  parameters:
  - name: connection_ref
    type: connection_ref
    required: true
  - name: collection
    type: string
    required: true
  - name: dimensions
    type: integer
    required: true
  - name: metric
    type: string
    required: false
  result_fields:
  - result.records
  - result.count
  - result.applied
  error_codes:
  - invalid_payload
  - invalid_connection
  - effect_claim_required
  - test_mode_suppressed
  - provider_unavailable
  - native_unavailable
  - invalid_provider_response
  - response_too_large
  - network_blocked
  - timeout
  - authentication_failed
  - index_configuration_mismatch
  - invalid_vector
  mutates_platform: false
  test_mode_behavior: suppress
  command_type: invoke_extension_action
