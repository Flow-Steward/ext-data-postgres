  test_mode_behavior: suppress
  command_type: invoke_extension_action
- action_id: upsert_chunk
  workflow_visible: true
  title: 'Vector: Save text fragment and embedding'
  description: 'Insert a text fragment or replace the fragment with the same Fragment ID in an existing
    collection. Select a direct PostgreSQL project connection, collection and Document ID; supply a stable
    Fragment ID and an embedding generated in an earlier step. Example: save manual_42_part_1 for document
    manual_42. Supply all content, metadata and source values you want to keep: omitted optional values
    are replaced with empty defaults. Use Update a text fragment to change selected fields only.'
  required_scopes:
  - extension:invoke
  handler:
    mode: extension
  parameters:
  - name: connection_ref
    type: connection_ref
    required: true
    description: Select an existing project connection. SQL writes require database write permission.
      Vector actions require the direct postgres profile, pgvector installed in public, and permission
      on the collection schema (fs_vectors by default). Keep credentials in the connection secrets.
  - name: chunk_id
    type: string
    required: true
    description: 'Stable identifier of one text fragment, unique within the collection. Example: manual_42_part_1.
      Reusing it in Save text fragment replaces the stored fragment, even if a different Document ID is
      supplied.'
  - name: collection
    type: string
    required: true
    description: Name of the collection table in the connection schema (fs_vectors by default). Use letters,
      digits and underscores; start with a letter or underscore; maximum 48 characters. Run Create or
      check a collection before saving or searching.
  - name: content
    type: string
    required: false
    description: Text to store or replace for this fragment, for example a paragraph from a manual. Generate
      a new embedding when changing its meaning; the action does not generate embeddings.
  - name: document_id
    type: string
    required: true
    description: Identifier shared by all fragments of one document, for example manual_42. Use the same
      ID to save its fragments and later remove them together.
  - name: metadata
    type: json
    required: false
    description: Optional JSON object used for filtering or context, for example language and category.
      The supplied object replaces the existing metadata; it is not merged.
  - name: source
    type: json
    required: false
    description: Optional JSON object returned with search results, for example a document URL or title.
      The supplied object replaces the existing source; it is not merged.
  - name: vector
    type: json
    required: true
    description: Numeric embedding from an earlier embedding-generation step. Use the same model and exact
      number of dimensions as the collection. [0.1,0.2,0.3] is an illustration for a 3-dimensional collection,
      not a replacement for a real model output.
  result_fields:
  - result.records
  - result.count
  - result.applied
  error_codes:
  - invalid_payload
  - invalid_connection
  - effect_claim_required
  - test_mode_suppressed
  - provider_unavailable
  - native_unavailable
  - invalid_provider_response
  - response_too_large
  - network_blocked
  - timeout
  - authentication_failed
  - index_configuration_mismatch
  - invalid_vector
  mutates_platform: false
  test_mode_behavior: suppress
  command_type: invoke_extension_action
