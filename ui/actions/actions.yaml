- action_id: query
  workflow_visible: true
  title: 'Vector: Search similar text'
  description: 'Find stored fragments related to a question or other text by comparing embeddings. Generate
    the query embedding in an earlier step using the same model as the stored fragments, then select a
    direct PostgreSQL project connection and collection and pass that vector. Example: retrieve the 5
    closest knowledge-base fragments to provide context to an answer step. Returns matching text, metadata,
    source and similarity scores. An optional metadata filter narrows the search; the action does not
    generate embeddings or an answer.'
  required_scopes:
  - extension:invoke
  handler:
    mode: extension
  parameters:
  - name: connection_ref
    type: connection_ref
    required: true
    description: Select an existing project connection. SQL writes require database write permission.
      Vector actions require the direct postgres profile, pgvector installed in public, and permission
      on the collection schema (fs_vectors by default). Keep credentials in the connection secrets.
  - name: collection
    type: string
    required: true
    description: Name of the collection table in the connection schema (fs_vectors by default). Use letters,
      digits and underscores; start with a letter or underscore; maximum 48 characters. Run Create or
      check a collection before saving or searching.
  - name: include_vector
    type: boolean
    required: false
    description: Optional; false by default. Enable only when a later step needs the numeric vector as
      well as the text and metadata.
  - name: limit
    type: integer
    required: false
    description: Return up to 1 to 100 matches; default 20. For example, start with 5 fragments for an
      answer step. Approximate search and metadata filters may return fewer matches.
  - name: metadata_filter
    type: json
    required: false
    description: Optional containment filter on stored metadata. For example, {"language":"en"} searches
      only fragments whose metadata contains that key and value. Omit it to search the whole collection.
  - name: min_score
    type: number
    required: false
    description: 'Optional cutoff; omit it when first trying a search. The score depends on the collection
      metric and is not a percentage: cosine uses 1-distance, l2 uses 1/(1+distance), and inner_product
      uses the dot product.'
  - name: vector
    type: json
    required: true
    description: Numeric embedding from an earlier embedding-generation step. Use the same model and exact
      number of dimensions as the collection. [0.1,0.2,0.3] is an illustration for a 3-dimensional collection,
      not a replacement for a real model output.
  result_fields:
  - result.records
  - result.count
  - result.applied
  error_codes:
  - invalid_payload
  - invalid_connection
  - effect_claim_required
  - test_mode_suppressed
  - provider_unavailable
  - native_unavailable
  - invalid_provider_response
  - response_too_large
  - network_blocked
  - timeout
  - authentication_failed
  - index_configuration_mismatch
  - invalid_vector
  mutates_platform: false
  command_type: invoke_extension_action
