- action_id: query
  workflow_visible: true
  title: 'Vector: Query'
  description: 'On the selected PostgreSQL connection: Return bounded nearest chunks with JSON metadata
    containment filter. Cosine score=1-distance; L2 score=1/(1+distance); inner-product score=dot product.'
  required_scopes:
  - extension:invoke
  handler:
    mode: extension
  parameters:
  - name: connection_ref
    type: connection_ref
    required: true
  - name: collection
    type: string
    required: true
  - name: include_vector
    type: boolean
    required: false
  - name: limit
    type: integer
    required: false
  - name: metadata_filter
    type: json
    required: false
  - name: min_score
    type: number
    required: false
  - name: vector
    type: json
    required: true
  result_fields:
  - result.records
  - result.count
  - result.applied
  error_codes:
  - invalid_payload
  - invalid_connection
  - effect_claim_required
  - test_mode_suppressed
