        value_type: text
        required: true
        display_name: Vector collection name
        schema:
          type: string
          pattern: ^[A-Za-z_][A-Za-z0-9_]{0,47}$
          minLength: 1
          maxLength: 48
        description: Name of the collection table in the connection schema (fs_vectors by default). Use letters,
          digits and underscores; start with a letter or underscore; maximum 48 characters. Run Create or
          check a collection before saving or searching.
      - name: include_vector
        value_type: boolean
        required: false
        display_name: Include embedding in results
        schema:
          type: boolean
        description: Optional; false by default. Enable only when a later step needs the numeric vector as
          well as the text and metadata.
      - name: limit
        value_type: integer
        required: false
        display_name: Maximum matching fragments
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: Return up to 1 to 100 matches; default 20. For example, start with 5 fragments for an
          answer step. Approximate search and metadata filters may return fewer matches.
      - name: metadata_filter
        value_type: json
        required: false
        display_name: Metadata filter (JSON)
        schema:
          type: object
        description: Optional containment filter on stored metadata. For example, {"language":"en"} searches
          only fragments whose metadata contains that key and value. Omit it to search the whole collection.
      - name: min_score
        value_type: number
        required: false
        display_name: Minimum similarity score
        schema:
          type: number
        description: 'Optional cutoff; omit it when first trying a search. The score depends on the collection
          metric and is not a percentage: cosine uses 1-distance, l2 uses 1/(1+distance), and inner_product
          uses the dot product.'
      - name: vector
        value_type: json
        required: true
        display_name: Embedding vector (JSON array)
        schema:
          type: array
          maxItems: 2000
          minItems: 1
          items:
            type: number
        description: Numeric embedding from an earlier embedding-generation step. Use the same model and exact
          number of dimensions as the collection. [0.1,0.2,0.3] is an illustration for a 3-dimensional collection,
