- dataset_connector
- action
- query
required_scopes:
- extension:invoke
machine_auth:
  service_account_key: svc_ext_data_connector_mcp_toolbox_postgres
  required_scopes:
  - extension:invoke
account_scope:
  scope_type: project
  description: PostgreSQL connections are project-scoped and resolved through project config and secrets.
