manifest_version: 2
lifecycle:
  data_schema_version: 1
  data_migrations: []
extension_id: flowsteward.data-connector-mcp-toolbox-postgres
kind: tool_provider
version: "1.4.5"
release_stage: active
display_name: PostgreSQL
description: |-
  Bring PostgreSQL data and vector retrieval into the same Flow Steward project connection. The read-only Dataset connector tests connections, inspects schemas, validates saved SQL, previews results and executes saved queries. SQL profiles cover direct PostgreSQL, AlloyDB Omni, AlloyDB for PostgreSQL and Cloud SQL for PostgreSQL. Workflow steps separately run one parameterized INSERT, UPDATE or DELETE, for example to record a completed approval or update an application record after processing.

  For direct PostgreSQL connections, pgvector actions create, inspect and explicitly drop collections; insert, retrieve, update or delete individual chunks; upsert documents; and delete documents. Similarity search supports cosine, L2 or inner product, metadata containment filters, minimum scores and optional returned vectors. Use these operations to store externally generated embeddings alongside document content, then retrieve related chunks for a later answer step.

  A database administrator must install pgvector before using vector actions, which do not run through the managed cloud profiles. Collections support up to 2,000 dimensions and searches up to 100 matches. A document upsert updates the supplied chunks; removing omitted chunks requires explicit deletion. Embedding generation and database triggers are outside this extension.
vendor:
  name: Flow Steward
  support_url: https://github.com/Flow-Steward/ext-data-postgres/issues
  website_url: https://github.com/Flow-Steward/ext-data-postgres
listing:
  category: data
  tags:
  - postgres
  - database
  - sql
  - dataset
  - pgvector
  - vector
  summary: "Use PostgreSQL datasets and SQL writes, plus pgvector collections, document chunks and similarity search."
  description: |-
    Bring PostgreSQL data and vector retrieval into the same Flow Steward project connection. The read-only Dataset connector tests connections, inspects schemas, validates saved SQL, previews results and executes saved queries. SQL profiles cover direct PostgreSQL, AlloyDB Omni, AlloyDB for PostgreSQL and Cloud SQL for PostgreSQL. Workflow steps separately run one parameterized INSERT, UPDATE or DELETE, for example to record a completed approval or update an application record after processing.

    For direct PostgreSQL connections, pgvector actions create, inspect and explicitly drop collections; insert, retrieve, update or delete individual chunks; upsert documents; and delete documents. Similarity search supports cosine, L2 or inner product, metadata containment filters, minimum scores and optional returned vectors. Use these operations to store externally generated embeddings alongside document content, then retrieve related chunks for a later answer step.

    A database administrator must install pgvector before using vector actions, which do not run through the managed cloud profiles. Collections support up to 2,000 dimensions and searches up to 100 matches. A document upsert updates the supplied chunks; removing omitted chunks requires explicit deletion. Embedding generation and database triggers are outside this extension.
  setup_summary: "Choose a direct PostgreSQL or supported AlloyDB/Cloud SQL profile and configure its connection fields and credentials; direct PostgreSQL requires a password. For vectors, use the direct postgres profile with administrator-installed pgvector in public, plus schema, TLS and timeout settings as needed."
package:
  format: flow-steward-extension
  license: Apache-2.0
  includes_source: true
billing_mode: free
upgrade_notes: Preserves PostgreSQL extension, connection and dataset identifiers. Adds pgvector actions
  to direct PostgreSQL project connections; the server administrator must install vector in public.
screenshots:
- label: Overview
  description: PostgreSQL connection profiles and supported operations.
  path: ui/components/overview.yaml
features:
- tool
- dataset_connector
- action
- query
required_scopes:
- extension:invoke
machine_auth:
  service_account_key: svc_ext_data_connector_mcp_toolbox_postgres
  required_scopes:
  - extension:invoke
account_scope:
  scope_type: project
  description: PostgreSQL connections are project-scoped and resolved through project config and secrets.
external_effects:
- operation_id: execute_write
  effect_kind: database_write
  channel: toolbox
  idempotency: required
  test_mode_behavior: suppress
- operation_id: delete_chunk
  effect_kind: database_write
  channel: toolbox
  idempotency: required
  test_mode_behavior: suppress
- operation_id: delete_document
  effect_kind: database_write
  channel: toolbox
  idempotency: required
  test_mode_behavior: suppress
- operation_id: drop_collection
  effect_kind: database_write
  channel: toolbox
  idempotency: required
  test_mode_behavior: suppress
- operation_id: ensure_collection
  effect_kind: database_write
  channel: toolbox
  idempotency: required
  test_mode_behavior: suppress
- operation_id: update_chunk
  effect_kind: database_write
  channel: toolbox
  idempotency: required
  test_mode_behavior: suppress
- operation_id: upsert_chunk
  effect_kind: database_write
  channel: toolbox
  idempotency: required
  test_mode_behavior: suppress
- operation_id: upsert_document
  effect_kind: database_write
  channel: toolbox
  idempotency: required
  test_mode_behavior: suppress
schemas:
  config: schemas/config.schema.yaml
  secrets: schemas/secrets.schema.yaml
  subscriptions: schemas/subscriptions.schema.yaml
entrypoint:
  mode: subprocess
  command:
  - python3
  - main.py
health:
  command:
  - python3
  - health.py
  timeout_seconds: 5
ui_manifest: ui/ui_manifest.yaml
query_manifest: ui/queries/queries.yaml
action_manifest: ui/actions/actions.yaml
runtime:
  contract_version: extension_host_v2
  extension_contract_v2:
    connection_types:
    - connection_type_id: toolbox_sql_writer
      display_name: PostgreSQL
      description: Project PostgreSQL connection for SQL writes and pgvector actions. Vector actions use
        the direct postgres profile and require pgvector in public.
      config_schema:
        type: object
        additionalProperties: false
        required:
        - prebuilt
        properties:
          prebuilt:
            type: string
            title: Connection profile
            enum: &id001
            - postgres
            - alloydb-omni
            - alloydb-postgres
            - cloud-sql-postgres
            description: Select a PostgreSQL connection profile.
          host:
            type: string
            title: Host
            minLength: 1
          port:
            type: integer
            title: Port
            minimum: 1
            maximum: 65535
          database:
            type: string
            title: Database
            minLength: 1
          user:
            type: string
            title: User
            minLength: 1
          query_params:
            type: string
            title: Connection query parameters
          project:
            type: string
            title: Cloud project
            minLength: 1
          region:
            type: string
            title: Cloud region
            minLength: 1
          cluster:
            type: string
            title: Cluster
            minLength: 1
          instance:
            type: string
            title: Instance
            minLength: 1
          ip_type:
            type: string
            title: IP type
          schema:
            type: string
            title: Vector schema
            default: fs_vectors
            pattern: ^[A-Za-z_][A-Za-z0-9_]{0,62}$
            description: Schema for pgvector collections on direct PostgreSQL connections.
          tls:
            type: boolean
            title: Verify vector TLS
            default: true
            description: Vector actions require verified TLS for public endpoints.
          request_timeout_seconds:
            type: integer
            title: Vector operation timeout
            minimum: 1
            maximum: 30
            default: 15
        allOf:
        - if:
            properties:
              prebuilt:
                const: postgres
            required:
            - prebuilt
          then:
            required:
            - database
            - host
            - user
        - if:
            properties:
              prebuilt:
                const: alloydb-omni
            required:
            - prebuilt
          then:
            required:
            - database
            - host
            - user
        - if:
            properties:
              prebuilt:
                const: alloydb-postgres
            required:
            - prebuilt
          then:
            required:
            - database
            - project
            - region
            - instance
            - cluster
        - if:
            properties:
              prebuilt:
                const: cloud-sql-postgres
            required:
            - prebuilt
          then:
            required:
            - database
            - project
            - region
            - instance
        title: PostgreSQL connection
      secret_schema:
        type: object
        additionalProperties: false
        properties:
          password:
            type: string
            title: Password
            minLength: 1
            description: Password is required for postgres. Supply password or the matching profile-specific
              secret env variable. Managed PostgreSQL/MySQL/AlloyDB IAM profiles keep password optional;
              public config env is not a credential source.
          env:
            type: object
            title: Profile-specific secret environment
            additionalProperties: false
            properties:
              ALLOYDB_OMNI_PASSWORD:
                type: string
                minLength: 1
              ALLOYDB_POSTGRES_PASSWORD:
                type: string
                minLength: 1
              CLOUD_SQL_POSTGRES_PASSWORD:
                type: string
                minLength: 1
              POSTGRES_PASSWORD:
                type: string
                minLength: 1
        title: PostgreSQL password
        description: Password is required for postgres. Supply password or the matching profile-specific
          secret env variable. Managed PostgreSQL/MySQL/AlloyDB IAM profiles keep password optional; public
          config env is not a credential source.
      capabilities:
        write_queries: true
      safety_profile:
        stores_secret_values: false
    dataset_connectors:
    - connector_id: toolbox_database
      connector_type_id: toolbox_database
      database_kind: database
      display_name: PostgreSQL
      description: Read-only schema inspection and saved queries for PostgreSQL.
      source_kind: database
      source_extension_id: flowsteward.data-connector-mcp-toolbox-postgres
      source_extension_name: PostgreSQL
      source_provider: PostgreSQL
      query_language: sql
      access_mode: read_only
      runtime_kind: local_extension
      runtime_adapter_ref: extensions/flowsteward_data_connector_mcp_toolbox_postgres/main.py
      connector_catalog:
      - source_kind: alloydb-omni
        connector_type_id: toolbox_alloydb_omni
        display_name: AlloyDB Omni
        query_language: sql
        preset_config:
          prebuilt: alloydb-omni
      - source_kind: alloydb-postgres
        connector_type_id: toolbox_alloydb_postgres
        display_name: AlloyDB for PostgreSQL
        query_language: sql
        preset_config:
          prebuilt: alloydb-postgres
      - source_kind: cloud-sql-postgres
        connector_type_id: toolbox_cloud_sql_postgres
        display_name: Cloud SQL for PostgreSQL
        query_language: sql
        preset_config:
          prebuilt: cloud-sql-postgres
      - source_kind: postgres
        connector_type_id: toolbox_postgres
        display_name: PostgreSQL
        query_language: sql
        preset_config:
          prebuilt: postgres
      connection_schema:
        type: object
        additionalProperties: false
        required:
        - prebuilt
        properties:
          prebuilt:
            type: string
            title: Connection profile
            enum: *id001
            description: Select a PostgreSQL connection profile.
          database:
            type: string
            title: Database or dataset
            description: Database, dataset, namespace, or local file value used by this Toolbox source
              when applicable.
          host:
            type: string
            title: Host
            description: Host for networked Toolbox sources when applicable.
          port:
            type: integer
            minimum: 1
            maximum: 65535
            title: Port
            description: Port for networked Toolbox sources when applicable.
          user:
            type: string
            title: User
            description: User name for sources that authenticate with a database user.
          query_params:
            type: string
            title: Query params
            description: Optional connection query params passed to Toolbox when supported by the source.
          project:
            type: string
            title: Cloud project
          region:
            type: string
            title: Cloud region
          cluster:
            type: string
            title: Cluster
          instance:
            type: string
            title: Instance
          ip_type:
            type: string
            title: IP type
          env:
            type: object
            title: Profile environment overrides
            additionalProperties: false
            properties:
              ALLOYDB_OMNI_HOST:
                type: string
              ALLOYDB_OMNI_PORT:
                type: string
              ALLOYDB_OMNI_DATABASE:
                type: string
              ALLOYDB_OMNI_USER:
                type: string
              ALLOYDB_OMNI_QUERY_PARAMS:
                type: string
              ALLOYDB_POSTGRES_PROJECT:
                type: string
              ALLOYDB_POSTGRES_REGION:
                type: string
              ALLOYDB_POSTGRES_CLUSTER:
                type: string
              ALLOYDB_POSTGRES_INSTANCE:
                type: string
              ALLOYDB_POSTGRES_DATABASE:
                type: string
              ALLOYDB_POSTGRES_USER:
                type: string
              ALLOYDB_POSTGRES_IP_TYPE:
                type: string
              CLOUD_SQL_POSTGRES_PROJECT:
                type: string
              CLOUD_SQL_POSTGRES_REGION:
                type: string
              CLOUD_SQL_POSTGRES_INSTANCE:
                type: string
              CLOUD_SQL_POSTGRES_DATABASE:
                type: string
              CLOUD_SQL_POSTGRES_USER:
                type: string
              CLOUD_SQL_POSTGRES_IP_TYPE:
                type: string
              POSTGRES_HOST:
                type: string
              POSTGRES_PORT:
                type: string
              POSTGRES_DATABASE:
                type: string
              POSTGRES_USER:
                type: string
              POSTGRES_QUERY_PARAMS:
                type: string
        allOf:
        - if:
            properties:
              prebuilt:
                const: postgres
            required:
            - prebuilt
          then:
            required:
            - database
            - host
            - user
        - if:
            properties:
              prebuilt:
                const: alloydb-omni
            required:
            - prebuilt
          then:
            required:
            - database
            - host
            - user
        - if:
            properties:
              prebuilt:
                const: alloydb-postgres
            required:
            - prebuilt
          then:
            required:
            - database
            - project
            - region
            - instance
            - cluster
        - if:
            properties:
              prebuilt:
                const: cloud-sql-postgres
            required:
            - prebuilt
          then:
            required:
            - database
            - project
            - region
            - instance
        title: PostgreSQL connection
      secret_schema:
        type: object
        additionalProperties: false
        properties:
          password:
            type: string
            title: Password
            minLength: 1
            description: Password is required for postgres. Supply password or the matching profile-specific
              secret env variable. Managed PostgreSQL/MySQL/AlloyDB IAM profiles keep password optional;
              public config env is not a credential source.
          env:
            type: object
            title: Profile-specific secret environment
            additionalProperties: false
            properties:
              ALLOYDB_OMNI_PASSWORD:
                type: string
                minLength: 1
              ALLOYDB_POSTGRES_PASSWORD:
                type: string
                minLength: 1
              CLOUD_SQL_POSTGRES_PASSWORD:
                type: string
                minLength: 1
              POSTGRES_PASSWORD:
                type: string
                minLength: 1
        description: Password is required for postgres. Supply password or the matching profile-specific
          secret env variable. Managed PostgreSQL/MySQL/AlloyDB IAM profiles keep password optional; public
          config env is not a credential source.
      capabilities:
        read_only: true
        test_connection: true
        schema_introspection: true
        validate_query: true
        preview_query: true
        execute_template: true
        infer_output_schema: true
        write_queries: false
        row_preview: true
      safety_profile:
        access_mode: read_only
        indexes_rows: false
        executes_write_queries: false
        requires_saved_template: true
      preview_support: true
      schema_refresh_support: true
    operation_manifest:
    - operation_id: execute_write
      display_name: Execute PostgreSQL write
      workflow_visible: true
      operation_kind: action
      category: database
      description: Execute one parameterized INSERT, UPDATE or DELETE using the selected project connection.
        INSERT supports database-specific upsert syntax.
      connection_type_ids:
      - toolbox_sql_writer
      required_scopes:
      - extension:invoke
      inputs:
      - name: connection_ref
        value_type: connection_ref
        required: true
      - name: sql
        value_type: text
        required: true
      - name: params
        value_type: object
        required: false
      - name: param_schema
        value_type: object
        required: false
      outputs:
      - name: status
        value_type: text
      - name: rows
        value_type: array
      - name: returned_row_count
        value_type: integer
      result_fields:
      - result.status
      - result.rows
      - result.returned_row_count
      error_codes:
      - invalid_payload
      - write_outcome_unknown
    - operation_id: test_connection
      workflow_visible: false
      operation_kind: action
      description: Validate that the PostgreSQL driver can list tables for the configured PostgreSQL connection.
      required_scopes:
      - extension:invoke
      result_fields:
      - result.status
      - result.connector_id
      - result.metadata.toolbox_prebuilt
      error_codes:
      - invalid_config
      - not_found
      - permission_denied
      - connector_runtime_failed
      - unknown_action
    - operation_id: introspect_schema
      workflow_visible: false
      operation_kind: action
      description: Return a normalized typed schema snapshot from the PostgreSQL driver list_tables output.
      required_scopes:
      - extension:invoke
      result_fields:
      - result.schema_snapshot.schema_version
      - result.schema_snapshot.resources[].resource_id
      - result.schema_snapshot.resources[].columns[].name
      - result.schema_snapshot.resources[].indexes[].columns[]
      - result.resource_count
      error_codes:
      - invalid_config
      - not_found
      - permission_denied
      - connector_runtime_failed
      - unknown_action
    - operation_id: validate_query
      workflow_visible: false
      operation_kind: action
      description: Validate a saved read-only query template against dataset resource scope.
      required_scopes:
      - extension:invoke
      result_fields:
      - result.valid
      - result.read_only
      - result.referenced_resources[]
      error_codes:
      - invalid_config
      - connector_runtime_failed
      - unknown_action
    - operation_id: preview_query
      workflow_visible: false
      operation_kind: action
      description: Execute a bounded read-only preview for a validated query template.
      required_scopes:
      - extension:invoke
      result_fields:
      - result.rows[]
      - result.row_count
      - result.output_schema
      error_codes:
      - invalid_config
      - connector_runtime_failed
      - unknown_action
    - operation_id: execute_template
      workflow_visible: false
      operation_kind: action
      description: Execute a saved read-only query template with named parameters and runtime row limits.
      required_scopes:
      - extension:invoke
      result_fields:
      - result.rows[]
      - result.row_count
      - result.output_schema
      - result.truncated
      error_codes:
      - invalid_config
      - connector_runtime_failed
      - unknown_action
    - operation_id: infer_output_schema
      workflow_visible: false
      operation_kind: action
      description: Infer output schema from a bounded read-only preview of the query template.
      required_scopes:
      - extension:invoke
      result_fields:
      - result.output_schema
      error_codes:
      - invalid_config
      - connector_runtime_failed
      - unknown_action
    - operation_id: ensure_collection
      display_name: Ensure Collection
      description: 'PostgreSQL pgvector: Create schema, dimensioned chunk table and HNSW index; verify
        existing dimension and metric. pgvector must already be installed in public.'
      operation_kind: action
      workflow_visible: true
      connection_type_ids:
      - toolbox_sql_writer
      category: database
      inputs:
      - name: connection_ref
        value_type: connection_ref
        required: true
        display_name: Connection
      - name: collection
        value_type: text
        required: true
        display_name: Collection
        schema:
          type: string
          pattern: ^[A-Za-z_][A-Za-z0-9_]{0,47}$
          minLength: 1
          maxLength: 48
      - name: dimensions
        value_type: integer
        required: true
        display_name: Dimensions
        schema:
          type: integer
          minimum: 1
          maximum: 2000
      - name: metric
        value_type: text
        required: false
        display_name: Metric
        schema:
          type: string
          enum:
          - cosine
          - l2
          - inner_product
          default: cosine
      outputs:
      - name: records
        value_type: json
      - name: count
        value_type: integer
      - name: applied
        value_type: boolean
      result_fields:
      - result.records
      - result.count
      - result.applied
      error_codes:
      - invalid_payload
      - invalid_connection
      - effect_claim_required
      - test_mode_suppressed
      - provider_unavailable
      - native_unavailable
      - invalid_provider_response
      - response_too_large
      - network_blocked
      - timeout
      - authentication_failed
      - index_configuration_mismatch
      - invalid_vector
      required_scopes:
      - extension:invoke
    - operation_id: get_collection
      display_name: Get Collection
      description: 'PostgreSQL pgvector: Get collection.'
      operation_kind: action
      workflow_visible: true
      connection_type_ids:
      - toolbox_sql_writer
      category: database
      inputs:
      - name: connection_ref
        value_type: connection_ref
        required: true
        display_name: Connection
      - name: collection
        value_type: text
        required: true
        display_name: Collection
        schema:
          type: string
          pattern: ^[A-Za-z_][A-Za-z0-9_]{0,47}$
          minLength: 1
          maxLength: 48
      outputs:
      - name: records
        value_type: json
      - name: count
        value_type: integer
      - name: applied
        value_type: boolean
      result_fields:
      - result.records
      - result.count
      - result.applied
      error_codes:
      - invalid_payload
      - invalid_connection
      - effect_claim_required
      - test_mode_suppressed
      - provider_unavailable
      - native_unavailable
      - invalid_provider_response
      - response_too_large
      - network_blocked
      - timeout
      - authentication_failed
      - index_configuration_mismatch
      - invalid_vector
      required_scopes:
      - extension:invoke
    - operation_id: drop_collection
      display_name: Drop Collection
      description: 'PostgreSQL pgvector: Drop collection table and indexes with explicit confirmation.'
      operation_kind: action
      workflow_visible: true
      connection_type_ids:
      - toolbox_sql_writer
      category: database
      inputs:
      - name: connection_ref
        value_type: connection_ref
        required: true
        display_name: Connection
      - name: collection
        value_type: text
        required: true
        display_name: Collection
        schema:
          type: string
          pattern: ^[A-Za-z_][A-Za-z0-9_]{0,47}$
          minLength: 1
          maxLength: 48
      - name: confirm
        value_type: boolean
        required: true
        display_name: Confirm
        schema:
          type: boolean
      outputs:
      - name: records
        value_type: json
      - name: count
        value_type: integer
      - name: applied
        value_type: boolean
      result_fields:
      - result.records
      - result.count
      - result.applied
      error_codes:
      - invalid_payload
      - invalid_connection
      - effect_claim_required
      - test_mode_suppressed
      - provider_unavailable
      - native_unavailable
      - invalid_provider_response
      - response_too_large
      - network_blocked
      - timeout
      - authentication_failed
      - index_configuration_mismatch
      - invalid_vector
      required_scopes:
      - extension:invoke
    - operation_id: upsert_chunk
      display_name: Upsert Chunk
      description: 'PostgreSQL pgvector: Upsert chunk.'
      operation_kind: action
      workflow_visible: true
      connection_type_ids:
      - toolbox_sql_writer
      category: database
      inputs:
      - name: connection_ref
        value_type: connection_ref
        required: true
        display_name: Connection
      - name: chunk_id
        value_type: text
        required: true
        display_name: Chunk Id
        schema:
          type: string
      - name: collection
        value_type: text
        required: true
        display_name: Collection
        schema:
          type: string
          pattern: ^[A-Za-z_][A-Za-z0-9_]{0,47}$
          minLength: 1
          maxLength: 48
      - name: content
        value_type: text
        required: false
        display_name: Content
        schema:
          type: string
      - name: document_id
        value_type: text
        required: true
        display_name: Document Id
        schema:
          type: string
      - name: metadata
        value_type: json
        required: false
        display_name: Metadata
        schema:
          type: object
      - name: source
        value_type: json
        required: false
        display_name: Source
        schema:
          type: object
      - name: vector
        value_type: json
        required: true
        display_name: Vector
        schema:
          type: array
          maxItems: 2000
          minItems: 1
          items:
            type: number
      outputs:
      - name: records
        value_type: json
      - name: count
        value_type: integer
      - name: applied
        value_type: boolean
      result_fields:
      - result.records
      - result.count
      - result.applied
      error_codes:
      - invalid_payload
      - invalid_connection
      - effect_claim_required
      - test_mode_suppressed
      - provider_unavailable
      - native_unavailable
      - invalid_provider_response
      - response_too_large
      - network_blocked
      - timeout
      - authentication_failed
      - index_configuration_mismatch
      - invalid_vector
      required_scopes:
      - extension:invoke
    - operation_id: upsert_document
      display_name: Upsert Document
      description: 'PostgreSQL pgvector: Atomically upsert 1 to 100 explicitly identified chunks for a
