    - operation_id: query
      display_name: 'Vector: Search similar text'
      description: 'Find stored fragments related to a question or other text by comparing embeddings. Generate
        the query embedding in an earlier step using the same model as the stored fragments, then select a
        direct PostgreSQL project connection and collection and pass that vector. Example: retrieve the 5
        closest knowledge-base fragments to provide context to an answer step. Returns matching text, metadata,
        source and similarity scores. An optional metadata filter narrows the search; the action does not
        generate embeddings or an answer.'
      operation_kind: action
      workflow_visible: true
      connection_type_ids:
      - toolbox_sql_writer
      category: database
      inputs:
      - name: connection_ref
        value_type: connection_ref
        required: true
        display_name: PostgreSQL project connection
        description: Select an existing project connection. SQL writes require database write permission.
          Vector actions require the direct postgres profile, pgvector installed in public, and permission
          on the collection schema (fs_vectors by default). Keep credentials in the connection secrets.
