runtime:
  contract_version: extension_host_v2
  extension_contract_v2:
    connection_types:
    - connection_type_id: toolbox_sql_writer
      display_name: PostgreSQL
      description: Project PostgreSQL connection for SQL writes and pgvector actions. Vector actions use
        the direct postgres profile and require pgvector in public.
      config_schema:
        type: object
        additionalProperties: false
        required:
        - prebuilt
        properties:
          prebuilt:
            type: string
            title: Connection profile
            enum: &id001
            - postgres
            - alloydb-omni
            - alloydb-postgres
            - cloud-sql-postgres
            description: Select a PostgreSQL connection profile.
          host:
            type: string
            title: Host
            minLength: 1
          port:
            type: integer
            title: Port
            minimum: 1
            maximum: 65535
          database:
            type: string
            title: Database
            minLength: 1
          user:
            type: string
            title: User
            minLength: 1
          query_params:
            type: string
            title: Connection query parameters
          project:
            type: string
            title: Cloud project
            minLength: 1
          region:
            type: string
            title: Cloud region
            minLength: 1
          cluster:
            type: string
            title: Cluster
            minLength: 1
          instance:
            type: string
            title: Instance
            minLength: 1
          ip_type:
            type: string
            title: IP type
          schema:
            type: string
            title: Vector schema
            default: fs_vectors
            pattern: ^[A-Za-z_][A-Za-z0-9_]{0,62}$
            description: Schema for pgvector collections on direct PostgreSQL connections.
          tls:
            type: boolean
            title: Verify vector TLS
            default: true
            description: Vector actions require verified TLS for public endpoints.
          request_timeout_seconds:
            type: integer
            title: Vector operation timeout
            minimum: 1
            maximum: 30
            default: 15
        allOf:
        - if:
            properties:
              prebuilt:
                const: postgres
            required:
            - prebuilt
          then:
            required:
            - database
            - host
            - user
        - if:
            properties:
              prebuilt:
                const: alloydb-omni
            required:
            - prebuilt
          then:
            required:
            - database
            - host
            - user
        - if:
            properties:
              prebuilt:
                const: alloydb-postgres
            required:
            - prebuilt
          then:
            required:
            - database
            - project
            - region
            - instance
            - cluster
        - if:
            properties:
              prebuilt:
                const: cloud-sql-postgres
            required:
            - prebuilt
          then:
            required:
            - database
            - project
            - region
            - instance
        title: PostgreSQL connection
      secret_schema:
        type: object
        additionalProperties: false
        properties:
          password:
            type: string
            title: Password
            minLength: 1
            description: Password is required for postgres. Supply password or the matching profile-specific
              secret env variable. Managed PostgreSQL/MySQL/AlloyDB IAM profiles keep password optional;
              public config env is not a credential source.
          env:
            type: object
            title: Profile-specific secret environment
            additionalProperties: false
            properties:
              ALLOYDB_OMNI_PASSWORD:
                type: string
                minLength: 1
              ALLOYDB_POSTGRES_PASSWORD:
                type: string
                minLength: 1
              CLOUD_SQL_POSTGRES_PASSWORD:
                type: string
                minLength: 1
              POSTGRES_PASSWORD:
                type: string
                minLength: 1
        title: PostgreSQL password
        description: Password is required for postgres. Supply password or the matching profile-specific
          secret env variable. Managed PostgreSQL/MySQL/AlloyDB IAM profiles keep password optional; public
          config env is not a credential source.
      capabilities:
        write_queries: true
      safety_profile:
        stores_secret_values: false
    dataset_connectors:
    - connector_id: toolbox_database
      connector_type_id: toolbox_database
      database_kind: database
      display_name: PostgreSQL
      description: Read-only schema inspection and saved queries for PostgreSQL.
      source_kind: database
      source_extension_id: flowsteward.data-connector-mcp-toolbox-postgres
      source_extension_name: PostgreSQL
      source_provider: PostgreSQL
      query_language: sql
      access_mode: read_only
      runtime_kind: local_extension
      runtime_adapter_ref: extensions/flowsteward_data_connector_mcp_toolbox_postgres/main.py
      connector_catalog:
      - source_kind: alloydb-omni
        connector_type_id: toolbox_alloydb_omni
        display_name: AlloyDB Omni
        query_language: sql
        preset_config:
          prebuilt: alloydb-omni
      - source_kind: alloydb-postgres
        connector_type_id: toolbox_alloydb_postgres
        display_name: AlloyDB for PostgreSQL
        query_language: sql
        preset_config:
          prebuilt: alloydb-postgres
      - source_kind: cloud-sql-postgres
        connector_type_id: toolbox_cloud_sql_postgres
        display_name: Cloud SQL for PostgreSQL
        query_language: sql
        preset_config:
          prebuilt: cloud-sql-postgres
      - source_kind: postgres
        connector_type_id: toolbox_postgres
        display_name: PostgreSQL
        query_language: sql
        preset_config:
          prebuilt: postgres
      connection_schema:
        type: object
        additionalProperties: false
        required:
        - prebuilt
        properties:
          prebuilt:
            type: string
            title: Connection profile
            enum: *id001
            description: Select a PostgreSQL connection profile.
          database:
            type: string
            title: Database or dataset
            description: Database, dataset, namespace, or local file value used by this Toolbox source
              when applicable.
          host:
            type: string
            title: Host
            description: Host for networked Toolbox sources when applicable.
          port:
            type: integer
            minimum: 1
            maximum: 65535
            title: Port
            description: Port for networked Toolbox sources when applicable.
          user:
            type: string
            title: User
            description: User name for sources that authenticate with a database user.
          query_params:
            type: string
            title: Query params
            description: Optional connection query params passed to Toolbox when supported by the source.
          project:
            type: string
            title: Cloud project
          region:
            type: string
            title: Cloud region
          cluster:
            type: string
            title: Cluster
          instance:
            type: string
            title: Instance
          ip_type:
            type: string
            title: IP type
          env:
            type: object
            title: Profile environment overrides
            additionalProperties: false
            properties:
              ALLOYDB_OMNI_HOST:
                type: string
              ALLOYDB_OMNI_PORT:
                type: string
              ALLOYDB_OMNI_DATABASE:
                type: string
              ALLOYDB_OMNI_USER:
                type: string
              ALLOYDB_OMNI_QUERY_PARAMS:
                type: string
              ALLOYDB_POSTGRES_PROJECT:
                type: string
              ALLOYDB_POSTGRES_REGION:
                type: string
              ALLOYDB_POSTGRES_CLUSTER:
                type: string
              ALLOYDB_POSTGRES_INSTANCE:
                type: string
              ALLOYDB_POSTGRES_DATABASE:
                type: string
              ALLOYDB_POSTGRES_USER:
                type: string
              ALLOYDB_POSTGRES_IP_TYPE:
                type: string
              CLOUD_SQL_POSTGRES_PROJECT:
                type: string
              CLOUD_SQL_POSTGRES_REGION:
                type: string
              CLOUD_SQL_POSTGRES_INSTANCE:
                type: string
              CLOUD_SQL_POSTGRES_DATABASE:
                type: string
              CLOUD_SQL_POSTGRES_USER:
                type: string
              CLOUD_SQL_POSTGRES_IP_TYPE:
                type: string
              POSTGRES_HOST:
                type: string
              POSTGRES_PORT:
                type: string
              POSTGRES_DATABASE:
                type: string
              POSTGRES_USER:
                type: string
              POSTGRES_QUERY_PARAMS:
                type: string
        allOf:
        - if:
            properties:
              prebuilt:
                const: postgres
            required:
            - prebuilt
          then:
            required:
            - database
            - host
            - user
        - if:
            properties:
              prebuilt:
                const: alloydb-omni
            required:
            - prebuilt
          then:
            required:
            - database
            - host
            - user
        - if:
            properties:
              prebuilt:
                const: alloydb-postgres
            required:
            - prebuilt
          then:
            required:
            - database
            - project
            - region
            - instance
            - cluster
        - if:
            properties:
              prebuilt:
                const: cloud-sql-postgres
            required:
            - prebuilt
          then:
            required:
            - database
            - project
            - region
            - instance
        title: PostgreSQL connection
      secret_schema:
        type: object
        additionalProperties: false
        properties:
          password:
            type: string
            title: Password
            minLength: 1
            description: Password is required for postgres. Supply password or the matching profile-specific
              secret env variable. Managed PostgreSQL/MySQL/AlloyDB IAM profiles keep password optional;
              public config env is not a credential source.
          env:
            type: object
            title: Profile-specific secret environment
            additionalProperties: false
            properties:
              ALLOYDB_OMNI_PASSWORD:
                type: string
                minLength: 1
              ALLOYDB_POSTGRES_PASSWORD:
                type: string
                minLength: 1
              CLOUD_SQL_POSTGRES_PASSWORD:
                type: string
                minLength: 1
              POSTGRES_PASSWORD:
                type: string
                minLength: 1
        description: Password is required for postgres. Supply password or the matching profile-specific
          secret env variable. Managed PostgreSQL/MySQL/AlloyDB IAM profiles keep password optional; public
          config env is not a credential source.
      capabilities:
        read_only: true
        test_connection: true
        schema_introspection: true
        validate_query: true
        preview_query: true
        execute_template: true
        infer_output_schema: true
        write_queries: false
        row_preview: true
      safety_profile:
        access_mode: read_only
        indexes_rows: false
        executes_write_queries: false
        requires_saved_template: true
      preview_support: true
      schema_refresh_support: true
    operation_manifest:
    - operation_id: execute_write
      display_name: 'SQL: Insert, update or delete rows'
      workflow_visible: true
      operation_kind: action
      category: database
      description: 'Write workflow results to your database using one parameterized INSERT, UPDATE or DELETE.
        Select a PostgreSQL project connection with write permission, enter SQL with :named parameters, and
        supply their values in Parameters. Example: after approval, UPDATE orders SET status = :status WHERE
        order_id = :order_id. INSERT ... ON CONFLICT DO UPDATE supports upserts. Dataset saved queries are
        read-only; use this action for writes. Test mode validates the input without writing.'
      connection_type_ids:
      - toolbox_sql_writer
      required_scopes:
      - extension:invoke
      inputs:
      - name: connection_ref
        value_type: connection_ref
        required: true
        display_name: PostgreSQL project connection
        description: Select an existing project connection. SQL writes require database write permission.
          Vector actions require the direct postgres profile, pgvector installed in public, and permission
          on the collection schema (fs_vectors by default). Keep credentials in the connection secrets.
      - name: sql
        value_type: text
        required: true
        display_name: SQL write statement
        description: Enter one INSERT, UPDATE or DELETE. Bind values with :named placeholders and supply their
          values in Parameters. INSERT ... ON CONFLICT DO UPDATE supports upserts. Use a Dataset saved query
          for SELECT reads. Test mode validates this action without writing.
      - name: params
        value_type: object
        required: false
        display_name: Parameters (JSON)
        description: 'Object containing a value for every :named placeholder in the SQL statement. Bind workflow
          values here rather than inserting them into the SQL text. Example: status and order_id for the statement
          above.'
      - name: param_schema
        value_type: object
        required: false
        display_name: "Parameter types (JSON Schema)"
        description: "Declare a type for every :named SQL placeholder in properties, matching the Parameters object. Required when SQL uses parameters; omit only for SQL without placeholders. Supported types: string, integer, number, boolean and null."
      outputs:
      - name: status
        value_type: text
      - name: rows
        value_type: array
      - name: returned_row_count
        value_type: integer
      result_fields:
      - result.status
      - result.rows
      - result.returned_row_count
      error_codes:
      - invalid_payload
      - write_outcome_unknown
    - operation_id: test_connection
      workflow_visible: false
      operation_kind: action
      description: Validate that the PostgreSQL driver can list tables for the configured PostgreSQL connection.
      required_scopes:
      - extension:invoke
      result_fields:
      - result.status
      - result.connector_id
      - result.metadata.toolbox_prebuilt
      error_codes:
      - invalid_config
      - not_found
      - permission_denied
      - connector_runtime_failed
      - unknown_action
    - operation_id: introspect_schema
      workflow_visible: false
      operation_kind: action
      description: Return a normalized typed schema snapshot from the PostgreSQL driver list_tables output.
      required_scopes:
      - extension:invoke
      result_fields:
      - result.schema_snapshot.schema_version
      - result.schema_snapshot.resources[].resource_id
      - result.schema_snapshot.resources[].columns[].name
      - result.schema_snapshot.resources[].indexes[].columns[]
      - result.resource_count
      error_codes:
      - invalid_config
      - not_found
      - permission_denied
      - connector_runtime_failed
      - unknown_action
    - operation_id: validate_query
      workflow_visible: false
      operation_kind: action
      description: Validate a saved read-only query template against dataset resource scope.
      required_scopes:
      - extension:invoke
      result_fields:
      - result.valid
      - result.read_only
      - result.referenced_resources[]
      error_codes:
      - invalid_config
      - connector_runtime_failed
      - unknown_action
    - operation_id: preview_query
      workflow_visible: false
      operation_kind: action
      description: Execute a bounded read-only preview for a validated query template.
      required_scopes:
      - extension:invoke
      result_fields:
      - result.rows[]
      - result.row_count
      - result.output_schema
      error_codes:
      - invalid_config
      - connector_runtime_failed
      - unknown_action
    - operation_id: execute_template
      workflow_visible: false
      operation_kind: action
      description: Execute a saved read-only query template with named parameters and runtime row limits.
      required_scopes:
      - extension:invoke
      result_fields:
      - result.rows[]
      - result.row_count
      - result.output_schema
      - result.truncated
      error_codes:
      - invalid_config
      - connector_runtime_failed
      - unknown_action
    - operation_id: infer_output_schema
      workflow_visible: false
      operation_kind: action
      description: Infer output schema from a bounded read-only preview of the query template.
      required_scopes:
      - extension:invoke
      result_fields:
      - result.output_schema
      error_codes:
      - invalid_config
      - connector_runtime_failed
      - unknown_action
    - operation_id: ensure_collection
      display_name: 'Vector: Create or check a collection'
      description: 'Prepare a table and search index for text fragments and their embeddings before loading
        a knowledge base. Select a direct PostgreSQL project connection with pgvector already installed in
        public. Example: collection knowledge_base, dimensions 1536, metric cosine. Set dimensions to the
        exact length produced by your embedding model. An existing collection must match the requested dimensions
        and metric.'
      operation_kind: action
      workflow_visible: true
      connection_type_ids:
      - toolbox_sql_writer
      category: database
      inputs:
      - name: connection_ref
        value_type: connection_ref
        required: true
        display_name: PostgreSQL project connection
        description: Select an existing project connection. SQL writes require database write permission.
          Vector actions require the direct postgres profile, pgvector installed in public, and permission
          on the collection schema (fs_vectors by default). Keep credentials in the connection secrets.
      - name: collection
        value_type: text
        required: true
        display_name: Vector collection name
        schema:
          type: string
          pattern: ^[A-Za-z_][A-Za-z0-9_]{0,47}$
          minLength: 1
          maxLength: 48
        description: Name of the collection table in the connection schema (fs_vectors by default). Use letters,
          digits and underscores; start with a letter or underscore; maximum 48 characters. Run Create or
          check a collection before saving or searching.
      - name: dimensions
        value_type: integer
        required: true
        display_name: Embedding dimensions
        schema:
          type: integer
          minimum: 1
          maximum: 2000
        description: 'Number of values in each embedding: 1 to 2000. Match your embedding model exactly; for
          example, use 1536 only when the model returns 1536 values. An existing collection must have the
          same dimensions.'
      - name: metric
        value_type: text
        required: false
        display_name: Similarity metric
        schema:
          type: string
          enum:
          - cosine
          - l2
          - inner_product
          default: cosine
        description: Use cosine (default), l2 or inner_product. Keep the same metric for the collection throughout
          ingestion and search. An existing collection must match this value.
      outputs:
      - name: records
        value_type: json
      - name: count
        value_type: integer
      - name: applied
        value_type: boolean
      result_fields:
      - result.records
      - result.count
      - result.applied
      error_codes:
      - invalid_payload
      - invalid_connection
      - effect_claim_required
      - test_mode_suppressed
      - provider_unavailable
      - native_unavailable
      - invalid_provider_response
      - response_too_large
      - network_blocked
      - timeout
      - authentication_failed
      - index_configuration_mismatch
      - invalid_vector
      required_scopes:
      - extension:invoke
    - operation_id: get_collection
      display_name: 'Vector: Inspect a collection'
      description: Check an existing vector collection before saving fragments or searching. Select a direct
        PostgreSQL project connection and enter the collection name, for example knowledge_base. Returns the
        embedding dimensions, distance metric and index validity; it does not return the stored documents
        or their total count.
      operation_kind: action
      workflow_visible: true
      connection_type_ids:
      - toolbox_sql_writer
      category: database
      inputs:
      - name: connection_ref
        value_type: connection_ref
        required: true
        display_name: PostgreSQL project connection
        description: Select an existing project connection. SQL writes require database write permission.
          Vector actions require the direct postgres profile, pgvector installed in public, and permission
          on the collection schema (fs_vectors by default). Keep credentials in the connection secrets.
      - name: collection
        value_type: text
        required: true
        display_name: Vector collection name
        schema:
          type: string
          pattern: ^[A-Za-z_][A-Za-z0-9_]{0,47}$
          minLength: 1
          maxLength: 48
        description: Name of the collection table in the connection schema (fs_vectors by default). Use letters,
          digits and underscores; start with a letter or underscore; maximum 48 characters. Run Create or
          check a collection before saving or searching.
      outputs:
      - name: records
        value_type: json
      - name: count
        value_type: integer
      - name: applied
        value_type: boolean
      result_fields:
      - result.records
      - result.count
      - result.applied
      error_codes:
      - invalid_payload
      - invalid_connection
      - effect_claim_required
      - test_mode_suppressed
      - provider_unavailable
      - native_unavailable
      - invalid_provider_response
      - response_too_large
      - network_blocked
      - timeout
      - authentication_failed
      - index_configuration_mismatch
      - invalid_vector
      required_scopes:
      - extension:invoke
    - operation_id: drop_collection
      display_name: 'Vector: Delete a collection and all its text'
      description: 'Remove a vector collection table, its indexes and every stored fragment. Use this to retire
        a knowledge base you no longer need. Select a direct PostgreSQL project connection, enter the collection
        name, and explicitly enable Confirm deletion. Example: remove a temporary collection named import_trial.
        This deletes data; test mode suppresses the deletion.'
      operation_kind: action
      workflow_visible: true
      connection_type_ids:
      - toolbox_sql_writer
      category: database
      inputs:
      - name: connection_ref
        value_type: connection_ref
        required: true
        display_name: PostgreSQL project connection
        description: Select an existing project connection. SQL writes require database write permission.
          Vector actions require the direct postgres profile, pgvector installed in public, and permission
          on the collection schema (fs_vectors by default). Keep credentials in the connection secrets.
      - name: collection
        value_type: text
        required: true
        display_name: Vector collection name
        schema:
          type: string
          pattern: ^[A-Za-z_][A-Za-z0-9_]{0,47}$
          minLength: 1
          maxLength: 48
        description: Name of the collection table in the connection schema (fs_vectors by default). Use letters,
