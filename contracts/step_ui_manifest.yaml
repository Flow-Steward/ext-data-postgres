{
  "forms": [
    {
      "operation_id": "execute_write",
      "title": "SQL: Insert, update or delete rows",
      "fields": [
        {
          "name": "sql",
          "widget_type": "textarea",
          "required": true,
          "label": "SQL write statement",
          "help_text": "Enter one INSERT, UPDATE or DELETE. Bind values with :named placeholders and supply their values in Parameters. INSERT ... ON CONFLICT DO UPDATE supports upserts. Use a Dataset saved query for SELECT reads. Test mode validates this action without writing.",
          "placeholder": "UPDATE orders SET status = :status WHERE order_id = :order_id"
        },
        {
          "name": "params",
          "widget_type": "json",
          "required": false,
          "label": "Parameters (JSON)",
          "help_text": "Object containing a value for every :named placeholder in the SQL statement. Bind workflow values here rather than inserting them into the SQL text. Example: status and order_id for the statement above.",
          "placeholder": "{\"status\":\"approved\",\"order_id\":1042}"
        },
        {
          "name": "param_schema",
          "widget_type": "json",
          "required": false,
          "label": "Parameter types (JSON Schema)",
          "help_text": "Declare a type for every :named SQL placeholder in properties, matching the Parameters object. Required when SQL uses parameters; omit only for SQL without placeholders. Supported types: string, integer, number, boolean and null.",
          "placeholder": "{\"type\":\"object\",\"properties\":{\"status\":{\"type\":\"string\"},\"order_id\":{\"type\":\"integer\"}},\"required\":[\"status\",\"order_id\"]}"
        }
      ]
    },
    {
      "operation_id": "ensure_collection",
      "title": "Vector: Create or check a collection",
      "fields": [
        {
          "name": "collection",
          "widget_type": "textarea",
          "label": "Vector collection name",
          "required": true,
          "help_text": "Name of the collection table in the connection schema (fs_vectors by default). Use letters, digits and underscores; start with a letter or underscore; maximum 48 characters. Run Create or check a collection before saving or searching.",
          "placeholder": "knowledge_base"
        },
        {
          "name": "dimensions",
          "widget_type": "number",
          "label": "Embedding dimensions",
          "required": true,
          "help_text": "Number of values in each embedding: 1 to 2000. Match your embedding model exactly; for example, use 1536 only when the model returns 1536 values. An existing collection must have the same dimensions.",
          "placeholder": "1536"
        },
        {
          "name": "metric",
          "widget_type": "textarea",
          "label": "Similarity metric",
          "required": false,
          "help_text": "Use cosine (default), l2 or inner_product. Keep the same metric for the collection throughout ingestion and search. An existing collection must match this value.",
          "placeholder": "cosine"
        }
      ]
    },
    {
      "operation_id": "get_collection",
      "title": "Vector: Inspect a collection",
      "fields": [
        {
          "name": "collection",
          "widget_type": "textarea",
          "label": "Vector collection name",
          "required": true,
          "help_text": "Name of the collection table in the connection schema (fs_vectors by default). Use letters, digits and underscores; start with a letter or underscore; maximum 48 characters. Run Create or check a collection before saving or searching.",
          "placeholder": "knowledge_base"
        }
      ]
    },
    {
      "operation_id": "drop_collection",
      "title": "Vector: Delete a collection and all its text",
      "fields": [
        {
          "name": "collection",
          "widget_type": "textarea",
          "label": "Vector collection name",
          "required": true,
          "help_text": "Name of the collection table in the connection schema (fs_vectors by default). Use letters, digits and underscores; start with a letter or underscore; maximum 48 characters. Run Create or check a collection before saving or searching.",
          "placeholder": "knowledge_base"
        },
        {
          "name": "confirm",
          "widget_type": "boolean",
          "label": "Confirm deletion of the collection and all fragments",
          "required": true,
          "help_text": "Enable explicitly to delete the collection table, its indexes and all stored text. Leave disabled unless you intend to remove the entire collection."
        }
      ]
    },
    {
      "operation_id": "upsert_chunk",
      "title": "Vector: Save text fragment and embedding",
      "fields": [
        {
          "name": "chunk_id",
          "widget_type": "textarea",
          "label": "Fragment ID",
          "required": true,
          "help_text": "Stable identifier of one text fragment, unique within the collection. Example: manual_42_part_1. Reusing it in Save text fragment replaces the stored fragment, even if a different Document ID is supplied.",
          "placeholder": "manual_42_part_1"
        },
        {
          "name": "collection",
          "widget_type": "textarea",
          "label": "Vector collection name",
          "required": true,
          "help_text": "Name of the collection table in the connection schema (fs_vectors by default). Use letters, digits and underscores; start with a letter or underscore; maximum 48 characters. Run Create or check a collection before saving or searching.",
          "placeholder": "knowledge_base"
        },
        {
          "name": "content",
          "widget_type": "textarea",
          "label": "Fragment text",
          "required": false,
          "help_text": "Text to store or replace for this fragment, for example a paragraph from a manual. Generate a new embedding when changing its meaning; the action does not generate embeddings.",
          "placeholder": "Refund requests can be submitted within 30 days."
        },
        {
          "name": "document_id",
          "widget_type": "textarea",
          "label": "Document ID",
          "required": true,
          "help_text": "Identifier shared by all fragments of one document, for example manual_42. Use the same ID to save its fragments and later remove them together.",
          "placeholder": "manual_42"
        },
        {
          "name": "metadata",
          "widget_type": "json",
          "label": "Fragment metadata (JSON)",
          "required": false,
          "help_text": "Optional JSON object used for filtering or context, for example language and category. The supplied object replaces the existing metadata; it is not merged.",
          "placeholder": "{\"language\":\"en\",\"category\":\"refunds\"}"
        },
        {
          "name": "source",
          "widget_type": "json",
          "label": "Document source (JSON)",
          "required": false,
          "help_text": "Optional JSON object returned with search results, for example a document URL or title. The supplied object replaces the existing source; it is not merged.",
          "placeholder": "{\"url\":\"https://example.com/manual\",\"title\":\"Customer manual\"}"
        },
        {
          "name": "vector",
          "widget_type": "json",
          "label": "Embedding vector (JSON array)",
          "required": true,
          "help_text": "Numeric embedding from an earlier embedding-generation step. Use the same model and exact number of dimensions as the collection. [0.1,0.2,0.3] is an illustration for a 3-dimensional collection, not a replacement for a real model output.",
          "placeholder": "[0.1,0.2,0.3]"
        }
      ]
    },
    {
      "operation_id": "upsert_document",
      "title": "Vector: Save document fragments and embeddings",
      "fields": [
        {
          "name": "chunks",
          "widget_type": "json",
          "label": "Document fragments (JSON array)",
          "required": true,
          "help_text": "Provide 1 to 100 objects. Each needs a unique chunk_id and vector; content and metadata are optional. Generate vectors before this step and match the collection dimensions. Omitted existing fragments are preserved. The example uses illustrative 3-dimensional vectors.",
          "placeholder": "[{\"chunk_id\":\"manual_42_part_1\",\"content\":\"Refunds within 30 days.\",\"vector\":[0.1,0.2,0.3],\"metadata\":{\"language\":\"en\"}}]"
        },
        {
          "name": "collection",
          "widget_type": "textarea",
          "label": "Vector collection name",
          "required": true,
          "help_text": "Name of the collection table in the connection schema (fs_vectors by default). Use letters, digits and underscores; start with a letter or underscore; maximum 48 characters. Run Create or check a collection before saving or searching.",
          "placeholder": "knowledge_base"
        },
        {
          "name": "document_id",
          "widget_type": "textarea",
          "label": "Document ID",
          "required": true,
          "help_text": "Identifier shared by all fragments of one document, for example manual_42. Use the same ID to save its fragments and later remove them together.",
          "placeholder": "manual_42"
        },
        {
          "name": "source",
          "widget_type": "json",
          "label": "Document source (JSON)",
          "required": false,
          "help_text": "Optional JSON object returned with search results, for example a document URL or title. The supplied object replaces the existing source; it is not merged.",
          "placeholder": "{\"url\":\"https://example.com/manual\",\"title\":\"Customer manual\"}"
        }
      ]
    },
    {
      "operation_id": "get_chunk",
      "title": "Vector: Read a saved text fragment",
      "fields": [
        {
          "name": "chunk_id",
          "widget_type": "textarea",
          "label": "Fragment ID",
          "required": true,
          "help_text": "Stable identifier of one text fragment, unique within the collection. Example: manual_42_part_1. Reusing it in Save text fragment replaces the stored fragment, even if a different Document ID is supplied.",
          "placeholder": "manual_42_part_1"
        },
        {
