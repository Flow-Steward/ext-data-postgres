    {
      "operation_id": "query",
      "title": "Vector: Search similar text",
      "fields": [
        {
          "name": "collection",
          "widget_type": "textarea",
          "label": "Vector collection name",
          "required": true,
          "help_text": "Name of the collection table in the connection schema (fs_vectors by default). Use letters, digits and underscores; start with a letter or underscore; maximum 48 characters. Run Create or check a collection before saving or searching.",
          "placeholder": "knowledge_base"
        },
        {
          "name": "include_vector",
          "widget_type": "boolean",
          "label": "Include embedding in results",
          "required": false,
          "help_text": "Optional; false by default. Enable only when a later step needs the numeric vector as well as the text and metadata."
        },
        {
          "name": "limit",
          "widget_type": "number",
          "label": "Maximum matching fragments",
          "required": false,
          "help_text": "Return up to 1 to 100 matches; default 20. For example, start with 5 fragments for an answer step. Approximate search and metadata filters may return fewer matches.",
          "placeholder": "5"
        },
        {
          "name": "metadata_filter",
          "widget_type": "json",
          "label": "Metadata filter (JSON)",
          "required": false,
          "help_text": "Optional containment filter on stored metadata. For example, {\"language\":\"en\"} searches only fragments whose metadata contains that key and value. Omit it to search the whole collection.",
          "placeholder": "{\"language\":\"en\"}"
        },
        {
          "name": "min_score",
          "widget_type": "number",
          "label": "Minimum similarity score",
          "required": false,
          "help_text": "Optional cutoff; omit it when first trying a search. The score depends on the collection metric and is not a percentage: cosine uses 1-distance, l2 uses 1/(1+distance), and inner_product uses the dot product."
        },
        {
          "name": "vector",
          "widget_type": "json",
          "label": "Question or search-text embedding (JSON array)",
          "required": true,
          "help_text": "Generate the embedding of the question or search text in an earlier step, using the same model and dimensions as the saved fragments. This field takes the numeric array, not the question text. The 3-value example is illustrative only.",
          "placeholder": "[0.1,0.2,0.3]"
        }
      ]
    }
  ]
}
