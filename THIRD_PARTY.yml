name: MCP Toolbox for Databases
version: 1.16.0
tag: v1.16.0
commit: 06ea49d9a487a72c22419b5a8d5c22c11f0d7485
source_url: https://github.com/googleapis/mcp-toolbox
license: Apache-2.0
build:
  script: scripts/build_toolbox.sh
  container_image: golang:1.27.3-bookworm@sha256:dc0963f32053e4bc451d24d87e3892d42d01021b61f093e98eb95c0352bb84b0
  go_version: 1.27.3
  targets:
  - linux-amd64
  - linux-arm64
  flags:
  - -trimpath
  - -buildvcs=false
  - -s
  - -w
  - -buildid=
  registered_prebuilts:
  - alloydb-omni
  - alloydb-postgres
  - cloud-sql-postgres
  - postgres
  local_patch: scripts/patches/0001-flowsteward-driver-bound-query-params.patch
  local_patch_purpose: Pass saved-query values to upstream RunSQL driver parameters
    without SQL interpolation.
  additional_local_patches:
  - path: scripts/patches/0002-flowsteward-managed-vector-safety.patch
    purpose: Preserve ordinary SQL behavior while bounding managed vector endpoint dialing, TLS, wire input and result rows/bytes.
  security_patch: scripts/patches/0003-flowsteward-security-dependencies.patch
  security_baseline: scripts/native-security-baseline.json
  approved_profiles_patch: scripts/patches/0004-flowsteward-approved-profiles.patch
  network_at_install_or_runtime: false
